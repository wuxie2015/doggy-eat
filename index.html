<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff6e5">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="feeding-demo.css">
  <title>狗狗的小餐厅</title>
</head>
<body>
  <main>
    <h1 class="sr-only">狗狗的小餐厅</h1>
    <div class="stage" id="demo-stage" data-mood="loading">
      <canvas role="img" aria-label="金毛狗狗和它的食盆" tabindex="0" hidden></canvas>
      <p class="sr-only" id="dog-message" role="status">狗狗马上就来…</p>
      <span id="bowl-target" aria-hidden="true" hidden></span>
      <span class="scene-status" aria-hidden="true"></span>
      <span id="meal-hearts" aria-hidden="true" hidden>♥</span>
      <div id="dog-picker" role="group" aria-label="选择狗狗" hidden>
        <button type="button" data-breed="retriever" aria-label="金毛" aria-pressed="true"></button>
        <button type="button" data-breed="shiba" aria-label="柴犬" aria-pressed="false"></button>
      </div>
      <details id="view-controls" hidden>
        <summary aria-label="设置"><span aria-hidden="true">⚙</span></summary>
        <div class="view-actions">
          <button type="button" id="toggle-sound" aria-label="静音进食音效"><span aria-hidden="true">♪</span></button>
          <button type="button" id="reset-view" aria-label="转回初始视角" hidden>↶</button>
          <p>真狗狗吃什么，先问问大人。</p>
          <p><a href="https://makeit3d.app/m/FoPm8hleRtWY">金毛 · MakeIt3D</a>（<a href="https://creativecommons.org/licenses/by-nc/4.0/">CC BY-NC 4.0</a>）</p>
          <p><a href="https://sketchfab.com/3d-models/8e613ab54ccb486c80a5042e8ff7424c">柴犬 · TdoubleU8</a>（<a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>，已调整材质并添加骨骼动画）</p>
          <p><a href="https://polyhaven.com/a/lebombo">客厅 · Greg Zaal</a> · <a href="https://polyhaven.com/a/wood_floor">地板 · Dimitrios Savva</a>（CC0）</p>
        </div>
      </details>
    </div>
    <div class="feeding-tray">
      <div class="food-grid" id="food-menu" role="group" aria-label="选一样食物喂狗狗"></div>
    </div>
    <template id="tap-cue">
      <span class="tap-cue" aria-hidden="true">👆</span>
    </template>
  </main>
  <script defer src="feeding-game.js"></script>
</body>
</html>
